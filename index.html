<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遊樂園搶修｜Scratch 除錯大作戰</title>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/msg/zh-hant.js"></script>
<style>
:root{--bg:#FFF6E5;--ink:#2b2440;--sub:#6b6280;--card:#fff;--line:#eadfcb;--pri:#ff7a59;--pri2:#ffb703;--ok:#2bb673;--bad:#e5484d;--blue:#4C97FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.screen{display:none;height:100vh;flex-direction:column}
.screen.on{display:flex}
.btn{border:0;border-radius:10px;padding:8px 14px;background:var(--pri);color:#fff;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(80,50,0,.08)}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:3px solid var(--line);min-height:56px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:900;color:var(--pri)}
.sp{flex:1}
.pill{background:#fff3d6;border-radius:20px;padding:5px 12px;font-size:14px;white-space:nowrap}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:13px;background:#eef3ff;color:#2d5bd7;margin-left:6px;vertical-align:middle}
/* 登入 */
#scrLogin{align-items:center;justify-content:center;background:linear-gradient(#bfe8ff,#fff6e5)}
.loginCard{width:min(440px,92vw);padding:28px;text-align:center}
.loginCard h1{margin:6px 0 4px;font-size:30px;color:var(--pri)}
.loginCard .big{font-size:64px}
.field{display:flex;gap:8px;align-items:center;margin:10px 0;text-align:left}
.field label{width:64px;font-weight:bold}
.field input{flex:1;border:2px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;font-family:inherit}
.err{color:var(--bad);min-height:22px;font-size:14px}
.linkb{background:none;border:0;color:#2d5bd7;text-decoration:underline;padding:4px}
/* 地圖 */
.mapMain{flex:1;display:flex;gap:14px;padding:14px;min-height:0}
#mapSvg{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#mapSvg svg{width:100%;height:100%;max-height:calc(100vh - 90px)}
#zonePanel{width:340px;padding:18px;overflow:auto}
.zoneNode{cursor:pointer}
.zoneNode.locked{cursor:not-allowed}
.pulse{animation:pulse 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08)}}
.lvList{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lvBtn{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.lvBtn:hover:not(:disabled){border-color:var(--pri)}
.lvBtn:disabled{opacity:.5;cursor:not-allowed}
.lvBtn .n{font-weight:900;color:var(--pri);width:34px}
.lvBtn .t{flex:1}
.lvBtn .s{font-size:13px;color:var(--sub)}
/* 關卡 */
.lvMain{flex:1;display:grid;grid-template-columns:300px 1fr 404px;gap:10px;padding:10px;min-height:0}
.task{padding:14px 16px;overflow:auto}
.task h3{margin:4px 0 6px;font-size:16px}
.task p{margin:4px 0 10px;line-height:1.6}
.zoneTag{font-size:13px;color:var(--sub);margin-bottom:4px}
.goal{background:#eafaf0;border:2px solid #bfe9cf;border-radius:12px;padding:8px 12px;margin:8px 0}
.goal p{margin:4px 0}
.how{background:#f3f0ff;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.55;margin:8px 0}
.quizQ{font-weight:bold;margin:12px 0 6px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.chip{color:#fff;border:0;font-weight:bold;border-radius:10px}
.opt.wrong{opacity:.45;text-decoration:line-through}
.opt.right{outline:3px solid var(--ok)}
.fb{margin:10px 0;border-radius:12px;padding:0;font-size:14px;line-height:1.55}
.fb.show{padding:9px 12px}
.fb.bad{background:#ffecec;color:#a32020}
.fb.good{background:#e7f8ee;color:#16683c}
.fb.info{background:#fff6d8;color:#6b4e00}
.hintItem{background:#fffbe8;border:2px dashed #f2cf63;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px;line-height:1.5;cursor:default}
.hintItem.clk{cursor:pointer}
.taskBtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wsCol{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--line);border-bottom:0;background:#f6f1e6;border-radius:12px 12px 0 0;padding:6px 14px;font-weight:bold}
.tab.on{background:#fff;color:var(--pri)}
#wsWrap{flex:1;position:relative;border-radius:0 14px 14px 14px;overflow:hidden;border:2px solid var(--line);background:#fff}
.tabs:empty+#wsWrap{border-radius:14px}
#ws{position:absolute;inset:0}
.stCol{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.stBar{display:flex;align-items:center;gap:6px}
.flag,.stopb{width:44px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:20px;padding:0}
.flag{background:#e9fbe9;border-color:#8fd18f}
.flag:disabled{opacity:.4;cursor:not-allowed}
.stage{border:3px solid #cfd6e6;border-radius:12px;overflow:hidden;background:#fff;line-height:0}
#cv{width:100%;height:auto;display:block;cursor:pointer}
.tests{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.tests button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:13px}
.tests button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stNote{font-size:13px;color:var(--sub);line-height:1.5}
/* 視窗 */
.modalBg{position:fixed;inset:0;background:rgba(30,20,50,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modalBg.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px 26px;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{margin:0 0 10px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal ul{padding-left:22px;line-height:1.8}
.scoreTbl{width:100%;border-collapse:collapse;margin:10px 0}
.scoreTbl td{padding:6px 4px;border-bottom:1px solid #f0e8da}
.scoreTbl td:last-child{text-align:right;font-weight:bold}
.scoreTbl tr.tot td{font-size:18px;color:var(--pri);border-bottom:0}
.explain{background:#eef6ff;border-radius:12px;padding:10px 14px;line-height:1.6}
.board{width:100%;border-collapse:collapse}
.board th,.board td{padding:7px 6px;text-align:center;border-bottom:1px solid #f0e8da}
.board th{background:#fff3d6}
.board tr.me td{background:#e7f8ee;font-weight:bold}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2440;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:60;font-size:15px}
#toast.on{opacity:1}
/* 老師投影 */
#scrBoard{background:linear-gradient(#141b4d,#3b2a6b);color:#fff}
#scrBoard .top{background:transparent;border:0;color:#fff}
.bigBoard{flex:1;overflow:auto;padding:10px 40px 30px}
.bigBoard .board{font-size:24px;color:#fff}
.bigBoard .board th{background:rgba(255,255,255,.15)}
.bigBoard .board td{border-color:rgba(255,255,255,.15)}
.blocklyText{font-weight:bold}
</style>
</head>
<body>

<!-- 登入 -->
<div id="scrLogin" class="screen">
  <div class="card loginCard">
    <div class="big">🎡🐛🔧</div>
    <h1>遊樂園搶修</h1>
    <div style="color:var(--sub);margin-bottom:14px">Scratch 除錯大作戰</div>
    <div id="lastBox"></div>
    <div class="field"><label>班級</label><input id="inCls" inputmode="numeric" maxlength="4" placeholder="例如 501"></div>
    <div class="field"><label>座號</label><input id="inSeat" inputmode="numeric" maxlength="2" placeholder="例如 7"></div>
    <div class="field"><label>名字</label><input id="inNick" maxlength="8" placeholder="名字或暱稱（8 個字內）"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="btnLogin" style="width:100%;font-size:18px;padding:12px">🔧 開始搶修！</button>
    <div style="margin-top:12px"><button class="linkb" id="btnTeacher">👩‍🏫 老師投影排行榜</button></div>
  </div>
</div>

<!-- 地圖 -->
<div id="scrMap" class="screen">
  <header class="top">
    <div class="brand">🎡 遊樂園搶修</div><div class="sp"></div>
    <div class="pill" id="mapPlayer"></div>
    <div class="pill">⭐ <b id="mapScore">0</b> 分</div>
    <div class="pill">🔧 <b id="mapDone">0</b> / 20 關</div>
    <button class="btn ghost small" id="btnBoard">🏆 排行榜</button>
    <button class="btn ghost small" id="btnStory">📜 故事</button>
    <button class="btn ghost small" id="btnLogout">換人</button>
  </header>
  <main class="mapMain"><div id="mapSvg"></div><aside id="zonePanel" class="card"></aside></main>
</div>

<!-- 關卡 -->
<div id="scrLevel" class="screen">
  <header class="top">
    <button class="btn ghost small" id="btnBack">← 地圖</button>
    <div style="font-size:18px"><span id="lvId" style="color:var(--pri);font-weight:900"></span> <b id="lvName"></b><span id="lvMode" class="badge"></span></div>
    <div class="sp"></div>
    <div class="pill">⏱ <b id="lvTime">0:00</b></div>
    <div class="pill" id="lvPot"></div>
    <button class="btn small" id="btnHint" style="background:var(--pri2);color:#4a3300">💡 提示</button>
    <button class="btn ghost small" id="btnSkip">⏭ 跳過</button>
  </header>
  <main class="lvMain">
    <section id="task" class="card task"></section>
    <section class="wsCol"><div id="tabs" class="tabs"></div><div id="wsWrap"><div id="ws"></div></div></section>
    <section class="stCol">
      <div class="stBar">
        <button id="btnGo" class="flag" title="執行（綠旗）">🏁</button>
        <button id="btnStop" class="stopb" title="停止">⏹</button>
        <div class="sp"></div>
        <button class="btn small ghost" id="btnDemo">👀 看正確效果</button>
        <button class="btn small ghost" id="btnReset">🔄 重置舞台</button>
      </div>
      <div class="stage"><canvas id="cv" width="480" height="360"></canvas></div>
      <div id="tests" class="tests"></div>
      <div id="stNote" class="stNote"></div>
    </section>
  </main>
</div>

<!-- 老師投影排行榜 -->
<div id="scrBoard" class="screen">
  <header class="top">
    <div class="brand" style="font-size:30px;color:#ffd166">🏆 遊樂園搶修 排行榜</div><div class="sp"></div>
    <span>班級：</span><input id="boardCls" maxlength="4" placeholder="全部" style="width:90px;font-size:18px;padding:6px;border-radius:8px;border:0">
    <span id="boardTime" style="opacity:.7;font-size:14px"></span>
    <button class="btn small" id="boardExit">離開</button>
  </header>
  <div class="bigBoard" id="bigBoard">讀取中…</div>
</div>

<div id="modal" class="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   ★ 老師可修改區 ★
   SCRIPT_URL：排行榜 Google Apps Script 網址（留空＝不使用排行榜）
   ===================================================================== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzrISkMUopfPdz6iDG6Y8dvGli7mM7JT5drOmWfoUXoEhdlg9QALYmnI2InCTESmf1khQ/exec';

/* ---------------- 小工具 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms || 2200); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
let modalClose = null;
function openModal(html, onClose) { $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); modalClose = onClose || null; }
function closeModal() { $('#modal').classList.remove('on'); const f = modalClose; modalClose = null; if (f) f(); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

/* =====================================================================
   積木 DSL（用來寫關卡程式）
   ===================================================================== */
const num = v => (v && typeof v === 'object') ? { shadow: { type: 'num', fields: { NUM: 0 } }, block: v } : { shadow: { type: 'num', fields: { NUM: v } } };
const txt = v => (v && typeof v === 'object') ? { shadow: { type: 'txt', fields: { TXT: '' } }, block: v } : { shadow: { type: 'txt', fields: { TXT: String(v) } } };
function chain(arr) { arr = arr.filter(Boolean); for (let i = arr.length - 2; i >= 0; i--) arr[i].next = { block: arr[i + 1] }; return arr[0]; }
const sub = arr => arr && arr.length ? { block: chain(arr) } : undefined;
const bool = c => c ? { block: c } : undefined;
function blk(type, inputs, fields) { const b = { type }; if (inputs) { const o = {}; for (const k in inputs) if (inputs[k]) o[k] = inputs[k]; if (Object.keys(o).length) b.inputs = o; } if (fields) b.fields = fields; return b; }
function hat(type, fields, body) { const h = blk(type, null, fields); if (body.length) h.next = { block: chain(body) }; return h; }
const K = {
  flag: (...b) => hat('ev_flag', null, b),
  click: (...b) => hat('ev_click', null, b),
  recv: (m, ...b) => hat('ev_recv', { MSG: m }, b),
  bcast: m => blk('ev_bcast', null, { MSG: m }),
  move: n => blk('mo_move', { N: num(n) }),
  right: n => blk('mo_right', { N: num(n) }),
  left: n => blk('mo_left', { N: num(n) }),
  goto: (x, y) => blk('mo_goto', { X: num(x), Y: num(y) }),
  point: d => blk('mo_point', { N: num(d) }),
  xpos: () => blk('mo_x'),
  sayfor: (s, n) => blk('lo_sayfor', { S: txt(s), N: num(n) }),
  say: s => blk('lo_say', { S: txt(s) }),
  show: () => blk('lo_show'),
  hide: () => blk('lo_hide'),
  clear: () => blk('pe_clear'),
  pdown: () => blk('pe_down'),
  pup: () => blk('pe_up'),
  wait: n => blk('ct_wait', { N: num(n) }),
  rep: (n, ...b) => blk('ct_repeat', { N: num(n), DO: sub(b) }),
  forever: (...b) => blk('ct_forever', { DO: sub(b) }),
  iff: (c, ...b) => blk('ct_if', { COND: bool(c), DO: sub(b) }),
  ifelse: (c, a, e) => blk('ct_ifelse', { COND: bool(c), DO: sub(a), ELSE: sub(e) }),
  stop: () => blk('ct_stop'),
  gt: (a, b) => blk('op_gt', { A: num(a), B: num(b) }),
  lt: (a, b) => blk('op_lt', { A: num(a), B: num(b) }),
  eq: (a, b) => blk('op_eq', { A: num(a), B: num(b) }),
  or: (a, b) => blk('op_or', { A: bool(a), B: bool(b) }),
  setv: (v, n) => blk('va_set', { N: num(n) }, { VAR: v }),
  chg: (v, n) => blk('va_change', { N: num(n) }, { VAR: v }),
  getv: v => blk('va_get', null, { VAR: v }),
  lclear: l => blk('li_clear', null, { LIST: l }),
  ladd: (s, l) => blk('li_add', { S: txt(s) }, { LIST: l }),
  llen: l => blk('li_len', null, { LIST: l }),
};
const id = (b, i) => (b.id = i, b);
const at = (x, y, b) => (b.x = x, b.y = y, b);

/* =====================================================================
   Blockly 積木外觀（Scratch 風格）
   ===================================================================== */
const COL = { motion: '#4C97FF', looks: '#9966FF', events: '#FFBF00', control: '#FFAB19', ops: '#59C059', vars: '#FF8C1A', lists: '#FF661A', pen: '#0FBD8C' };
const NUMCK = ['Number', 'String'];
let CUR = null; // 目前關卡狀態
const optVar = () => ((CUR && CUR.L.varNames) || ['變數']).map(v => [v, v]);
const optList = () => ((CUR && CUR.L.listNames) || ['清單']).map(v => [v, v]);
const optMsg = () => ((CUR && CUR.L.messages) || ['訊息1']).map(v => [v, v]);
function defBlocks() {
  const J = (type, json, isHat) => { Blockly.Blocks[type] = { init() { this.jsonInit(json); if (isHat) this.hat = 'cap'; } }; };
  const V = n => ({ type: 'input_value', name: n, check: NUMCK });
  const B = n => ({ type: 'input_value', name: n, check: 'Boolean' });
  const ST = n => ({ type: 'input_statement', name: n });
  const stmt = (type, msg, args, cat) => J(type, { message0: msg, args0: args || [], colour: COL[cat], inputsInline: true, previousStatement: null, nextStatement: null });
  J('num', { message0: '%1', args0: [{ type: 'field_number', name: 'NUM', value: 0 }], output: null, colour: '#ffffff' });
  J('txt', { message0: '%1', args0: [{ type: 'field_input', name: 'TXT', text: '' }], output: null, colour: '#ffffff' });
  J('ev_flag', { message0: '當 🏁 被點擊', colour: COL.events, nextStatement: null }, true);
  J('ev_click', { message0: '當角色被點擊', colour: COL.events, nextStatement: null }, true);
  stmt('mo_move', '移動 %1 點', [V('N')], 'motion');
  stmt('mo_right', '右轉 ↻ %1 度', [V('N')], 'motion');
  stmt('mo_left', '左轉 ↺ %1 度', [V('N')], 'motion');
  stmt('mo_goto', '定位到 x: %1 y: %2', [V('X'), V('Y')], 'motion');
  stmt('mo_point', '面朝 %1 度', [V('N')], 'motion');
  J('mo_x', { message0: 'x 座標', output: 'Number', colour: COL.motion });
  stmt('lo_sayfor', '說出 %1 持續 %2 秒', [V('S'), V('N')], 'looks');
  stmt('lo_say', '說出 %1', [V('S')], 'looks');
  stmt('lo_show', '顯示', [], 'looks');
  stmt('lo_hide', '隱藏', [], 'looks');
  stmt('pe_clear', '筆跡全部清除', [], 'pen');
  stmt('pe_down', '下筆', [], 'pen');
  stmt('pe_up', '停筆', [], 'pen');
  stmt('ct_wait', '等待 %1 秒', [V('N')], 'control');
  J('ct_repeat', { message0: '重複 %1 次', args0: [V('N')], message1: '%1', args1: [ST('DO')], colour: COL.control, previousStatement: null, nextStatement: null, inputsInline: true });
  J('ct_forever', { message0: '不停重複', message1: '%1', args1: [ST('DO')], colour: COL.control, previousStatement: null });
  J('ct_if', { message0: '如果 %1 那麼', args0: [B('COND')], message1: '%1', args1: [ST('DO')], colour: COL.control, previousStatement: null, nextStatement: null, inputsInline: true });
  J('ct_ifelse', { message0: '如果 %1 那麼', args0: [B('COND')], message1: '%1', args1: [ST('DO')], message2: '否則', message3: '%1', args3: [ST('ELSE')], colour: COL.control, previousStatement: null, nextStatement: null, inputsInline: true });
  J('ct_stop', { message0: '停止 全部', colour: COL.control, previousStatement: null });
  J('op_gt', { message0: '%1 > %2', args0: [V('A'), V('B')], output: 'Boolean', colour: COL.ops, inputsInline: true });
  J('op_lt', { message0: '%1 < %2', args0: [V('A'), V('B')], output: 'Boolean', colour: COL.ops, inputsInline: true });
  J('op_eq', { message0: '%1 = %2', args0: [V('A'), V('B')], output: 'Boolean', colour: COL.ops, inputsInline: true });
  J('op_or', { message0: '%1 或 %2', args0: [B('A'), B('B')], output: 'Boolean', colour: COL.ops, inputsInline: true });
  const D = (type, cat, kind, build) => {
    Blockly.Blocks[type] = { init() {
      build(this); this.setColour(COL[cat]); this.setInputsInline(true);
      if (kind === 'stmt') { this.setPreviousStatement(true); this.setNextStatement(true); }
      else if (kind === 'hat') { this.setNextStatement(true); this.hat = 'cap'; }
      else this.setOutput(true, null);
    } };
  };

function calcScore(st) {
  const t = st.t || 0, tb = t <= 60 ? 50 : t >= 300 ? 0 : Math.round(50 * (300 - t) / 240);
  const hc = [0, 10, 30, 60][st.h || 0], wc = 5 * (st.w || 0);
  return { tb, hc, wc, total: Math.max(20, 100 + tb - hc - wc) };
}

  return { score, cleared, time, hints };
}

  drawBg(L.bg);
  ctx.lineCap = 'round'; ctx.lineWidth = 5;
  for (const l of w.lines) { ctx.strokeStyle = l.c; ctx.beginPath(); ctx.moveTo(240 + l.x1, 180 - l.y1); ctx.lineTo(240 + l.x2, 180 - l.y2); ctx.stroke(); }
  for (const s of w.sprites) {
    if (!s.visible) continue;
    ctx.save(); ctx.translate(240 + s.x, 180 - s.y);
    if (s.rotate) ctx.rotate((s.dir - 90) * Math.PI / 180);
    if (s.faceLeft) ctx.scale(-1, 1);
    ctx.font = `${s.size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s.emoji, 0, 0);
    ctx.restore();
  }
  for (const s of w.sprites) if (s.visible && s.say !== '') bubble(s);
  // 變數、清單監視器
  let my = 8;
  for (const n of L.varNames) {
    ctx.font = 'bold 13px "Microsoft JhengHei",sans-serif';
    const v = String(w.vars[n]), tw = ctx.measureText(n).width, vw = Math.max(28, ctx.measureText(v).width + 14);
    ctx.fillStyle = '#f4f4f4'; ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = 1; rr(8, my, tw + vw + 22, 26, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#575e75'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(n, 15, my + 13);
    ctx.fillStyle = COL.vars; rr(tw + 20, my + 4, vw, 18, 9); ctx.fill(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(v, tw + 20 + vw / 2, my + 13);
    my += 32;
  }
  for (const n of L.listNames) {
    const items = w.lists[n] || [], bx = 340, bw = 130, bh = Math.max(60, 46 + items.length * 22);
    ctx.fillStyle = '#f4f4f4'; ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = 1; rr(bx, 8, bw, bh, 6); ctx.fill(); ctx.stroke();
    ctx.font = 'bold 13px "Microsoft JhengHei",sans-serif'; ctx.fillStyle = '#575e75'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n, bx + bw / 2, 20);
    items.forEach((it, i) => { const y = 32 + i * 22; ctx.fillStyle = '#575e75'; ctx.textAlign = 'left'; ctx.font = '12px sans-serif'; ctx.fillText(i + 1, bx + 6, y + 9); ctx.fillStyle = COL.lists; rr(bx + 22, y, bw - 30, 19, 4); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Microsoft JhengHei",sans-serif'; ctx.fillText(it, bx + 28, y + 10); });
    ctx.fillStyle = '#575e75'; ctx.font = '12px "Microsoft JhengHei",sans-serif'; ctx.textAlign = 'center'; ctx.fillText('項目數量：' + items.length, bx + bw / 2, 8 + bh - 10);
  }
  if (CUR.demo) { ctx.fillStyle = 'rgba(43,182,115,.92)'; rr(150, 326, 180, 26, 13); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 14px "Microsoft JhengHei",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👀 示範：正確的效果', 240, 339); }
}
function bubble(s) {
  ctx.font = 'bold 15px "Microsoft JhengHei",sans-serif';
  const t = s.say, tw = Math.min(200, ctx.measureText(t).width), bw = tw + 22, bh = 32;
  let bx = 240 + s.x + s.size * 0.25, by = 180 - s.y - s.size * 0.5 - bh - 10;
  bx = Math.max(4, Math.min(476 - bw, bx)); by = Math.max(4, by);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#b8b8c8'; ctx.lineWidth = 2;
  rr(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + 16, by + bh - 1); ctx.lineTo(bx + 10, by + bh + 10); ctx.lineTo(bx + 28, by + bh - 1); ctx.fill();
  ctx.fillStyle = '#2b2440'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, bx + 11, by + bh / 2, 200);
}

/* =====================================================================
   啟動
   ===================================================================== */
let THEME;
window.addEventListener('resize', () => { if (ws) Blockly.svgResize(ws); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#btnBoard').onclick = () => showBoard();
$('#btnStory').onclick = showStory;
$('#btnLogout').onclick = () => { P = null; store('park1_last', ''); initLogin(); };
// 開發測試：在主控台執行 await __selftest()，確認每關「原本的程式不會過、正解會過」
window.__selftest = async function () {
  const out = [];
  for (const L of LEVELS) {
    if (!L.check) continue;
    const bug = await L.check(o => runFast(L, L.sprites.map(s => s.code()), o));
    const fix = await L.check(o => runFast(L, solProgs(L), o));
    out.push(`${L.id} 原本:${bug.ok ? '過✗' : '不過✓'} 正解:${fix.ok ? '過✓' : '不過✗ ' + fix.msg}`);
  }
  return out.join('\n');
};
(function boot() {
  if (!window.Blockly) { document.body.innerHTML = '<div style="padding:40px;font-size:20px">⚠️ 積木程式庫載入失敗，請確認網路連線後重新整理。</div>'; return; }
  defBlocks();
  THEME = Blockly.Theme.defineTheme('park', { base: Blockly.Themes.Classic, fontStyle: { family: '"Microsoft JhengHei","PingFang TC",sans-serif', weight: 'bold', size: 12 }, componentStyles: { workspaceBackgroundColour: '#F9F9FB', flyoutBackgroundColour: '#EEF1F7', flyoutOpacity: 1, scrollbarColour: '#cfd3de', insertionMarkerColour: '#000000' } });
  requestAnimationFrame(drawStage);
  if (new URLSearchParams(location.search).get('board')) return teacherBoard();
  initLogin();
})();
</script>
